# Short URLs — paste into the UltiOrganizer root .htaccess.
#
# OPTIONAL. Everything works without this: live/overlays/.htaccess already serves
# /live/overlays/702, /live/overlays/702/overlay and the rest, and the long
# ?view=live/overlays/... form always works. This block only shortens the URLs to
# /s/ and /c/ — which matters when the thing typing them is a video switcher's
# on-screen keyboard.
#
# It is the one file this project cannot install itself, because it belongs to
# the host root rather than to live/overlays/. Append it to that .htaccess. If it
# ever conflicts with an upstream change, deleting it costs nothing but length.
#
# Yes, it has to be PASTED — .htaccess has no import mechanism. Apache's Include
# and IncludeOptional are valid in server config, virtual host and <Directory>
# context only; in .htaccess they are a hard error, not a silent no-op:
#
#     /var/www/html/.htaccess: IncludeOptional not allowed here
#
# and the server returns 500 for every request under that directory until the
# line is removed. Tested on the Apache in docs/dev, 2026-08-22. If you do have
# vhost access, putting these rules there instead works and is tidier; on shared
# hosting, pasting is the only route.
#
#   /s/            studio
#   /s/702         scoreboard for game 702
#   /s/702/green   ... on a green chroma-key background
#   /s/702/overlay stage pinned to game 702 — the browser source
#   /c/702         commentator page for game 702
#
# Requires mod_rewrite and AllowOverride All.
<IfModule mod_rewrite.c>
    RewriteEngine On

    # Never shadow a real file or directory.
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^s(/|$) - [L]

    # The stage: one URL for a whole broadcast, so it is the one most worth
    # typing on a switcher's on-screen keyboard. Listed before the numeric
    # rules because "stage" is a name, not a game id.
    RewriteRule ^s/stage/([0-9A-Fa-f]{6}|green|blue|magenta|black)/?$ \
        index.php?view=live/overlays/stage&bg=$1 [L,QSA]

    RewriteRule ^s/stage/?$ index.php?view=live/overlays/stage [L,QSA]

    # A stage pinned to one game, so several can run side by side — one per
    # field, each with its own switcher. Listed before the bare-number rules
    # because "overlay" is a name, not a background colour.
    RewriteRule ^s/([0-9]+)/overlay/([0-9A-Fa-f]{6}|green|blue|magenta|black)/?$ \
        index.php?view=live/overlays/stage&game=$1&bg=$2 [L,QSA]

    RewriteRule ^s/([0-9]+)/overlay/?$ \
        index.php?view=live/overlays/stage&game=$1 [L,QSA]

    RewriteRule ^s/([0-9]+)/([0-9A-Fa-f]{6}|green|blue|magenta|black)/?$ \
        index.php?view=live/overlays/scoreboard&game=$1&bg=$2 [L,QSA]

    RewriteRule ^s/([0-9]+)/?$ \
        index.php?view=live/overlays/scoreboard&game=$1 [L,QSA]

    RewriteRule ^s/?$ index.php?view=live/overlays/index [L,QSA]

    # The commentary position gets its own short entry point. Separate from /s/
    # because it is a different job and a different person: /s/ is the operator
    # deciding what goes on air, /c/ is the person talking over it.
    RewriteRule ^c/([0-9]+)/?$ \
        index.php?view=live/overlays/commentator&game=$1 [L,QSA]

    RewriteRule ^c/?$ index.php?view=live/overlays/commentator [L,QSA]
</IfModule>
