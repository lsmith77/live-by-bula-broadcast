# Continuous integration for the broadcast overlays.
#
# WHAT THIS CANNOT DO, AND WHY IT IS NOT AN OVERSIGHT
#
# These overlays run inside an UltiOrganizer installation with Live! by BULA,
# and the browser suite deliberately drives a real instance rather than a mock
# — the payload shape is exactly the thing that has been wrong before, so a
# fake would prove the wrong thing convincingly. Live! is third-party software
# distributed under a signed Terms of Use, so a public workflow cannot check it
# out, and `live/` is gitignored in UltiOrganizer for the same reason.
#
# So `npm test` (the browser suite) stays a local gate against a real instance.
# What runs here is everything that needs no instance — the pure logic carrying
# the rules a defect would be quietest in, and, since standalone mode's front
# controller landed, a real HTTP suite against `php -S` that proves the routing
# and the operator-state guards.
#
# THE BROWSER SUITE COULD NOW RUN HERE, AND DELIBERATELY DOES NOT
#
# With the recorded provider, a capture is enough to render every page with no
# host at all, and the standalone job proves exactly that for the commentary
# desk. Pointing the whole browser suite at a capture would therefore work.
#
# It is not done because of what it would quietly stop testing. That suite
# drives a real instance because the PAYLOAD SHAPE is the thing that has been
# wrong before — `teams.hometeam` rather than `awayteam`, `poolinfo.timecap` in
# minutes, an error body that is a string. A capture is real data, which makes
# it far better than a mock, but it is data frozen on the day it was taken. Run
# the suite against it and every one of those assertions passes forever,
# including after Live! changes the shape underneath. That is the mock problem
# wearing a better disguise, and it would be worst precisely when it mattered.
#
# So the division is: this workflow proves the logic, the routing and the
# guards, and that a page renders from a recording. `npm test` against a real
# instance proves the contract with Live!, and remains a human's job before a
# branch is called done. A green tick here is not a green suite, and the docs
# say so in the same words.
#
# The other route, if the contract ever needs proving automatically: mirror
# Live! privately, add a deploy key as a secret, stand up PHP and MySQL with
# `fixtures/dev-fixture.sql`, and set `ADMIN_PASS`. Secrets are not exposed to
# workflows from forked pull requests, so it would only run on pushes and
# same-repository branches.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The host project runs 8.3 in its own CI; 8.4 is what these files are
        # written against locally. Both, so a syntax-level feature that would
        # break the older host is caught here rather than there.
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint every PHP file
        run: |
          # -print0/-0 because a path with a space would otherwise be linted as
          # two files that do not exist, and `php -l` reports success for those.
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 -P4 php -l

  units:
    name: Shared logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # `npm ci` needs a lockfile and installs devDependencies, which here is
      # the Playwright test runner alone. No browsers are downloaded: nothing in
      # the unit config opens a page, and `playwright install` is deliberately
      # absent so that a spec which starts needing one fails here loudly.
      - run: npm ci

      - name: Shared modules load under CommonJS
        run: node tests/modules.mjs

      - name: Pure logic
        run: npm run test:unit

  standalone:
    name: Standalone front controller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Chromium only, and only here: most of this suite drives HTTP directly,
      # but the tests that prove a page RENDERS from a capture need a real
      # browser. Unlike the main config this one does not ask for system
      # Chrome, so the bundled build is what it wants.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The reason this can run at all: standalone mode needs no UltiOrganizer,
      # no Live!, no database and no Apache — just PHP's built-in server and a
      # recorded capture. It builds its own hostless tree per run.
      #
      # What it guards is the thing most worth guarding: that conf/ — which
      # holds the commentary desk's notes about named people — is not served
      # over HTTP. `php -S` does not read .htaccess, so those rules exist a
      # second time in app.php's router, and only a request can prove it.
      - name: Routing, guards, and a page rendered from a capture
        run: npm run test:standalone

  docs:
    name: Docs and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every relative doc link resolves
        # The docs are load-bearing here — most of what they record is *why*
        # something is the way it is — and they cross-reference each other
        # heavily. A rename that breaks a link is silent until somebody follows
        # it and finds nothing.
        run: |
          status=0
          while IFS= read -r -d '' file; do
            dir=$(dirname "$file")
            # Markdown links to relative paths only: skip http(s), anchors and
            # mailto, and strip any #fragment before testing the path.
            grep -oE '\]\([^)#]+\.(md|sql|conf|png|gif|sh|php|js|yml)(#[^)]*)?\)' "$file" \
              | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
              | while read -r link; do
                  case "$link" in
                    http*|mailto:*) continue ;;
                  esac
                  if [ ! -e "$dir/$link" ]; then
                    echo "$file: broken link -> $link"
                    exit 1
                  fi
                done || status=1
          done < <(find . -name '*.md' -not -path './node_modules/*' -print0)
          exit $status
